name: ICP API Probe

on:
  push:
    branches:
      - feature/international-col-categories

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe category endpoint patterns
        run: |
          node - <<'NODE'
          const urls = [
            'https://api.worldbank.org/v2/country/JP/indicator/1107000?format=json&source=62',
            'https://api.worldbank.org/v2/country/JP/indicator/PX.WL?format=json&source=62',
            'https://api.worldbank.org/v2/country/JP/indicator/1107000.PX.WL?format=json&source=62',
            'https://api.worldbank.org/v2/country/JP/indicator/9060000?format=json&source=62',
            'https://api.worldbank.org/v2/country/JP/indicator/9060000.PX.WL?format=json&source=62'
          ];
          for (const url of urls) {
            try {
              const r = await fetch(url, { headers: { 'User-Agent': 'MilitaryRetirementPlanner/0.1 (+https://github.com/EverForgeInc/Retire)' } });
              const text = await r.text();
              console.log('\nURL', url, 'STATUS', r.status, '\n', text.slice(0, 1500));
            } catch (e) {
              console.log('ERROR', url, e.message);
            }
          }
          NODE
