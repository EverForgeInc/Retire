name: ICP API Probe

on:
  push:
    branches:
      - feature/international-col-categories

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact OECD detailed category query
        run: |
          node - <<'NODE'
          const url = 'https://sdmx.oecd.org/public/rest/data/OECD.SDD.TPS,DSD_PPP@DF_PPP_CPL,1.0/JPN.A.PL.A0106..OECD?startPeriod=2022&dimensionAtObservation=AllDimensions';
          const r = await fetch(url, { headers: { 'User-Agent': 'MilitaryRetirementPlanner/0.1 (+https://github.com/EverForgeInc/Retire)', 'Accept': 'text/csv' } });
          const text = await r.text();
          console.log('status', r.status, 'content-type', r.headers.get('content-type'));
          console.log(text.slice(0, 6000));
          if (!r.ok) throw new Error(`OECD query failed ${r.status}`);
          NODE
