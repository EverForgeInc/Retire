name: ICP API Probe

on:
  push:
    branches:
      - feature/international-col-categories

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OECD detailed price-level response
        run: |
          node - <<'NODE'
          const url = 'https://sdmx.oecd.org/public/rest/v1/data/OECD.SDD.TPS,DSD_PPP@DF_PPP_CPL,1.0/JPN.A.PL....?startPeriod=2022&dimensionAtObservation=AllDimensions';
          const r = await fetch(url, {
            headers: {
              'User-Agent': 'MilitaryRetirementPlanner/0.1 (+https://github.com/EverForgeInc/Retire)',
              'Accept': 'text/csv'
            }
          });
          console.log('status', r.status, 'content-type', r.headers.get('content-type'));
          const text = await r.text();
          console.log(text.slice(0, 12000));
          if (!r.ok || !text.includes('REF_AREA')) throw new Error('OECD CSV query failed');
          NODE
