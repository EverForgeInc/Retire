name: ICP API Probe

on:
  push:
    branches:
      - feature/international-col-categories

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover ICP source and sample category API
        run: |
          node - <<'NODE'
          async function get(url) {
            const r = await fetch(url, { headers: { 'User-Agent': 'MilitaryRetirementPlanner/0.1 (+https://github.com/EverForgeInc/Retire)' } });
            if (!r.ok) throw new Error(`${url} -> ${r.status}`);
            return r.json();
          }
          const sources = await get('https://api.worldbank.org/v2/source?format=json&per_page=500');
          const rows = sources?.[1] ?? [];
          const matches = rows.filter(x => /International Comparison Program/i.test(x.name || ''));
          console.log('ICP sources', matches.map(x => ({ id: x.id, name: x.name, lastupdated: x.lastupdated })));
          for (const source of matches) {
            const series = await get(`https://api.worldbank.org/v2/source/${source.id}/series?format=json&per_page=5000`);
            const list = series?.[1] ?? [];
            const px = list.filter(x => /PX\.WL/i.test(x.id || '') || /price level/i.test(x.name || ''));
            console.log('SOURCE', source.id, source.name, 'series matches', px.slice(0, 20));
          }
          NODE
