name: World Bank COL Smoke Test

on:
  push:
    branches:
      - feature/international-col-benchmark

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live international benchmark
        run: |
          node - <<'NODE'
          const url = 'https://api.worldbank.org/v2/country/JP/indicator/PA.NUS.PRVT.PLI?format=json&per_page=10';
          const response = await fetch(url, { headers: { 'User-Agent': 'MilitaryRetirementPlanner/0.1 (+https://github.com/EverForgeInc/Retire)' } });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          if (!Array.isArray(payload) || !Array.isArray(payload[1])) throw new Error('Unexpected World Bank response shape');
          const observation = payload[1].find(item => typeof item.value === 'number' && Number.isFinite(item.value));
          if (!observation) throw new Error('No numeric household price-level observation found for Japan');
          console.log(`World Bank live benchmark reachable: ${observation.country.value} ${observation.date} = ${observation.value}`);
          NODE
