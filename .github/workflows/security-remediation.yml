name: Security Remediation

on:
  push:
    branches:
      - chore/security-remediation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/security-remediation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current branch
        run: npm ci

      - name: Apply maintenance-LTS security upgrades
        run: |
          npm install next@15.5.24 eslint-config-next@15.5.24 --save-exact
          npm install vitest@4.1.11 --save-dev --save-exact
          npm pkg set overrides.deepmerge-ts="^8.0.0"
          npm pkg set overrides.postcss="^8.5.23"
          npm install
          npm audit fix

      - name: Require no high or critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Commit validated dependency set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Use patched Next 15 LTS dependency set"
          git push origin HEAD:chore/security-remediation
