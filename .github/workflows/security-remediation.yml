name: Security Remediation

on:
  push:
    branches:
      - chore/security-remediation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/security-remediation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit before remediation
        continue-on-error: true
        run: npm audit

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Require no high or critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Commit dependency remediation
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Fix dependency vulnerabilities"
          git push origin HEAD:chore/security-remediation
