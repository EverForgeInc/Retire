services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: milretire
      POSTGRES_PASSWORD: milretire
      POSTGRES_DB: milretire
    ports:
      - "5432:5432"
    volumes:
      - milretire_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milretire -d milretire"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  milretire_pg:
