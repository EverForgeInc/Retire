title = "Retire gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "generic-secrets"
description = "Prevent obvious secret-like values from being committed."
regex = '''(?i)(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|xox[baprs]-[0-9A-Za-z-]{10,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (?:RSA |DSA |EC |OPENSSH )?PRIVATE KEY)'''
severity = "high"

[allowlist]
paths = [
  "(^|/)\\.env\\.example$",
  "(^|/)node_modules/",
  "(^|/)package-lock\\.json$",
  "(^|/)test-results/"
]
